[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "governed-incident-triage"
version = "0.1.0"
description = "An LLM incident triage classifier shipped with its evaluation harness and accountability model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai-governance", "llm-evaluation", "incident-management", "itil", "model-risk"]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
gbdt = ["scikit-learn>=1.4", "xgboost>=2.0", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
triage = "triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# str+Enum is retained over StrEnum for stable JSON serialisation across the
# pydantic versions this package supports.
ignore = ["UP042"]

[tool.pytest.ini_options]
pythonpath = ["src", "evals"]
testpaths = ["tests"]
